name: Tests

on:
  push:
    branches:
      - main
      - master
      - '*.x'
  pull_request:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  security-audit:
    runs-on: ubuntu-latest
    name: Dependency Security Audit

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, curl, libxml, mbstring, zip, pcntl
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Audit Composer lock
        run: composer audit --locked --no-interaction --abandoned=report

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit npm lock
        run: npm audit --audit-level=high

  sqlite:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: [8.3, 8.4, 8.5]

    name: SQLite / PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Execute SQLite tests
        run: php artisan test

      - name: Prepare release evidence reference data
        if: matrix.php == 8.3
        run: php artisan migrate:fresh --seed --force

      - name: Generate release evidence
        if: matrix.php == 8.3
        run: php artisan release:evidence --commit="$GITHUB_SHA" --output=storage/app/release-evidence.json

      - name: Upload release evidence
        if: matrix.php == 8.3
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.sha }}
          path: storage/app/release-evidence.json
          if-no-files-found: error
          retention-days: 30

  mysql:
    runs-on: ubuntu-latest
    name: MySQL 8.4 / PHP 8.3

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: complaint_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Execute MySQL parity tests
        run: vendor/bin/phpunit --configuration phpunit.mysql.xml
